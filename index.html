<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>📚 在线练习 · 第17课</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
body { background:#f4f7fc; min-height:100vh; padding:20px; display:flex; justify-content:center; }
.app { max-width:900px; width:100%; background:white; border-radius:28px; box-shadow:0 12px 40px rgba(0,0,0,0.06); padding:30px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; border-bottom:2px solid #edf2f7; padding-bottom:16px; }
.header h1 { font-size:24px; font-weight:700; color:#1a2634; }
.header h1 span { background:#2a6fdb; color:white; font-size:14px; padding:0 14px; border-radius:30px; line-height:28px; margin-left:10px; }
.student-badge { background:#edf2f7; padding:6px 18px; border-radius:40px; font-size:14px; color:#2a6fdb; font-weight:600; }
.steps { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; border-bottom:1px solid #eef3f9; padding-bottom:14px; }
.step-btn { padding:8px 20px; border-radius:40px; border:none; background:transparent; color:#8a9aa8; font-weight:600; font-size:14px; cursor:pointer; transition:0.2s; }
.step-btn.active { background:#2a6fdb; color:white; box-shadow:0 4px 12px rgba(42,111,219,0.25); }
.step-btn.done { color:#27ae60; }
.step-btn.done::after { content:" ✓"; }
.step-btn:disabled { opacity:0.5; cursor:not-allowed; }
.panel { display:none; animation:fade 0.3s ease; }
.panel.active { display:block; }
@keyframes fade { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.card { background:#fafcff; border-radius:18px; padding:20px 24px; border:1px solid #e6edf6; margin-bottom:16px; }
.card-title { font-size:16px; font-weight:700; color:#1a2634; margin-bottom:12px; display:flex; gap:8px; align-items:center; }
.card-title .tag { background:#d4e4ff; color:#2a6fdb; font-size:12px; padding:0 12px; border-radius:30px; line-height:22px; font-weight:600; }
.text-block { font-size:15px; line-height:1.9; color:#1f2a3a; white-space:pre-wrap; }
.text-block .emphasis { background:#d4e4ff; padding:2px 10px; border-radius:6px; font-weight:600; }

/* 参考词汇框 */
.ref-words { display:flex; justify-content:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.ref-word-chip { background:linear-gradient(135deg,#fff3e0,#ffe0b2); border:2px solid #ff9800; color:#e65100; font-size:20px; font-weight:800; padding:8px 22px; border-radius:12px; cursor:default; user-select:none; box-shadow:0 2px 6px rgba(255,152,0,0.2); letter-spacing:2px; }

/* 红色例句 */
.example-sentence { font-size:19px; font-weight:700; color:#ffffff; background:linear-gradient(135deg,#e53935,#c62828); border-left:6px solid #b71c1c; padding:14px 20px; border-radius:12px; margin-bottom:20px; line-height:1.8; box-shadow:0 4px 12px rgba(198,40,40,0.25); }
.example-sentence .em-orange { color:#ffcc80; }

/* 填空输入框 */
.blank-input { border:none; border-bottom:2.5px dashed #2a6fdb; background:transparent; font-size:17px; font-weight:600; color:#1a2634; width:64px; padding:0 4px; outline:none; text-align:center; margin:0 2px; vertical-align:middle; }
.blank-input.small { width:44px; }
.blank-input:focus { border-bottom-color:#6c5ce7; border-bottom-style:solid; }
.blank-input.correct { border-bottom-color:#27ae60; color:#27ae60; }
.blank-input.wrong { border-bottom-color:#e74c3c; color:#e74c3c; }

/* 原有样式 */
.form-group { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:16px; align-items:center; }
.form-group label { font-weight:600; color:#4a5b6e; min-width:60px; font-size:15px; }
.form-group input { padding:10px 16px; border:1.5px solid #dce4ed; border-radius:12px; font-size:15px; background:white; flex:1; min-width:180px; outline:none; }
.form-group input:focus { border-color:#2a6fdb; box-shadow:0 0 0 3px rgba(42,111,219,0.1); }
.vocab-row { display:flex; align-items:center; gap:20px; margin-bottom:14px; flex-wrap:wrap; }
.vocab-word { font-weight:600; font-size:18px; min-width:80px; }
.vocab-select { padding:8px 12px; border:1.5px solid #dce4ed; border-radius:8px; font-size:15px; background:white; flex:1; min-width:150px; outline:none; }
.vocab-select:focus { border-color:#2a6fdb; }
.vocab-select.correct { border-color:#27ae60; background:#eafaf1; }
.vocab-select.wrong { border-color:#e74c3c; background:#fdedec; }
.vocab-feedback { font-size:14px; margin-left:10px; }
.btn { padding:12px 36px; border:none; border-radius:40px; font-weight:700; font-size:16px; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:8px; }
.btn-primary { background:#2a6fdb; color:white; box-shadow:0 4px 14px rgba(42,111,219,0.25); }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(42,111,219,0.3); }
.btn-primary:disabled { opacity:0.5; transform:none; cursor:not-allowed; }
.btn-outline { background:transparent; color:#4a5b6e; border:2px solid #dce4ed; }
.btn-outline:hover { border-color:#2a6fdb; color:#2a6fdb; }
.action-bar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-top:28px; padding-top:20px; border-top:2px solid #edf2f7; gap:14px; }
.report-card { background:white; border-radius:20px; border:1px solid #e6edf6; padding:24px 28px; margin-top:10px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin:16px 0; }
.stat-item { background:#f7faff; border-radius:14px; padding:12px 16px; text-align:center; }
.stat-item .num { font-size:26px; font-weight:700; }
.stat-item .label { font-size:13px; color:#6a7b8c; }
.teacher-panel { margin-top:30px; border-top:2px dashed #dce4ed; padding-top:24px; }
.teacher-panel table { width:100%; border-collapse:collapse; font-size:14px; margin-top:12px; }
.teacher-panel th, .teacher-panel td { padding:10px 12px; border:1px solid #e6edf6; text-align:left; }
.teacher-panel th { background:#f7faff; font-weight:600; color:#1a2634; }
.text-muted { color:#6a7b8c; font-size:14px; }
.mt-8 { margin-top:8px; }
.hidden { display:none !important; }
.pron-table { width:100%; border-collapse:collapse; margin-top:8px; }
.pron-table th, .pron-table td { border:1px solid #dce4ed; padding:8px 12px; text-align:left; vertical-align:middle; }
.pron-table th { background:#f7faff; font-weight:600; color:#1a2634; }
.pron-table input[type="text"], .pron-table input[type="number"] { width:100%; padding:6px 8px; border:1px solid #dce4ed; border-radius:6px; font-size:14px; background:white; }
.pron-table input[type="checkbox"] { width:18px; height:18px; cursor:pointer; }
.pron-table .del-btn { background:#e74c3c; color:white; border:none; padding:4px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
.pron-table .del-btn:hover { background:#c0392b; }
@media (max-width:600px) { .app { padding:18px 14px; } .header h1 { font-size:20px; } .step-btn { padding:6px 14px; font-size:13px; } .card { padding:16px; } .blank-input { width:50px; font-size:15px; } .blank-input.small { width:36px; } .vocab-row { gap:10px; } .vocab-word { font-size:16px; min-width:60px; } .btn { padding:10px 20px; font-size:15px; } .report-card { padding:18px 16px; } .stat-grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>📚 在线练习 <span>第17课</span></h1>
    <div class="student-badge" id="studentBadge">👤 未登录</div>
  </div>

  <nav class="steps" id="stepNav">
    <button class="step-btn active" data-step="0" onclick="goToStep(0)">1. 信息</button>
    <button class="step-btn" data-step="1" disabled onclick="goToStep(1)">2. 课文</button>
    <button class="step-btn" data-step="2" disabled onclick="goToStep(2)">3. 生词</button>
    <button class="step-btn" data-step="3" disabled onclick="goToStep(3)">4. 语法</button>
    <button class="step-btn" data-step="4" disabled onclick="goToStep(4)">5. 智言纠音</button>
    <button class="step-btn" data-step="5" disabled onclick="goToStep(5)">6. 笔记</button>
  </nav>

  <div id="panels">
    <!-- 步骤0：学生信息 -->
    <div class="panel active" data-step="0">
      <div class="card">
        <div class="card-title">👤 学生信息</div>
        <div class="form-group"><label>姓名</label><input type="text" id="studentName" placeholder="请输入你的名字"></div>
        <div class="form-group"><label>班级</label><input type="text" id="studentClass" placeholder="例如：CLT004" value="CLT004"></div>
        <div class="form-group"><label>日期</label><input type="date" id="studentDate"></div>
        <div style="margin-top:12px;"><button class="btn btn-primary" onclick="startPractice()">🚀 开始练习</button></div>
        <p class="text-muted mt-8">* 信息将用于生成你的专属学习笔记。</p>
      </div>
      <div style="text-align:right;margin-top:10px;"><button class="btn btn-outline" onclick="toggleTeacher()">📊 教师后台</button></div>
      <div id="teacherPanel" class="teacher-panel hidden"></div>
    </div>

    <!-- 步骤1：课文 -->
    <div class="panel" data-step="1">
      <div class="card"><div class="card-title">📖 课文理解 <span class="tag">阅读</span></div><div class="text-block" id="textContent"></div></div>
      <div class="card"><div class="card-title">💬 回答问题</div><div id="textQuestions"></div></div>
      <div class="action-bar"><button class="btn btn-outline" onclick="goToStep(0)">← 返回</button><button class="btn btn-primary" onclick="goToStep(2)">下一步 →</button></div>
    </div>

    <!-- 步骤2：生词 -->
    <div class="panel" data-step="2">
      <div class="card">
        <div class="card-title">📚 生词匹配 <span class="tag">选择拼音</span></div>
        <p class="text-muted">为每个生词选择正确的拼音。</p>
        <div id="vocabMatch"></div>
      </div>
      <div class="action-bar"><button class="btn btn-outline" onclick="goToStep(1)">← 返回</button><button class="btn btn-primary" onclick="goToStep(3)">下一步 →</button></div>
    </div>

    <!-- 步骤3：语法 -->
    <div class="panel" data-step="3">
      <div class="card">
        <div class="card-title">📐 语言点 <span class="tag">带状态补语的"比"字句</span></div>
        <div id="grammarPractice"></div>
      </div>
      <div class="action-bar"><button class="btn btn-outline" onclick="goToStep(2)">← 返回</button><button class="btn btn-primary" onclick="goToStep(4)">下一步 →</button></div>
    </div>

    <!-- 步骤4：智言纠音 -->
    <div class="panel" data-step="4">
      <div class="card">
        <div class="card-title">🎤 智言纠音 <span class="tag">记录读错的字</span></div>
        <p class="text-muted">根据课堂朗读，记录你读错的汉字、正确读音、标红次数，并标记是否已改正。</p>
        <table class="pron-table" id="pronTable"><thead><tr><th>读错的字</th><th>正确读音</th><th>标红几次</th><th>改对了 ✓</th><th>操作</th></tr></thead><tbody id="pronTbody"></tbody></table>
        <button class="btn btn-outline" style="margin-top:12px;" onclick="addPronRow()">➕ 添加一行</button>
      </div>
      <div class="action-bar"><button class="btn btn-outline" onclick="goToStep(3)">← 返回</button><button class="btn btn-primary" onclick="goToStep(5)">生成笔记 →</button></div>
    </div>

    <!-- 步骤5：笔记 -->
    <div class="panel" data-step="5">
      <div class="report-card" id="finalReport"></div>
      <div class="action-bar"><button class="btn btn-outline" onclick="goToStep(4)">← 返回</button><button class="btn btn-success" onclick="resetAll()">🔄 重新练习</button></div>
    </div>
  </div>
</div>

<script>
// ================================================================
// 📦 数据配置（✅ 填空题按正确结构：V后空=得，B前空=比，B后空=形容词）
// ================================================================
const DATA = {
  text: `早上，麦克在操场上跑步，看见山本来晚了……
麦克：山本，你怎么现在才来？我以为你不来了呢。
山本：昨天咳嗽咳得很厉害，晚上没睡好，今天比平时起得晚了一点儿。
麦克：你怎么了？感冒了吗？
山本：不是，医生说我抽烟抽得太多了。
麦克：抽烟对身体没有好处，你还是少抽一点儿吧。
山本：医生也劝我少抽烟，多锻炼。对了，学校的运动会你报名了吗？
麦克：没有。我当拉拉队队员，给同学们加油。
山本：我觉得你跑步跑得比我们都快，不报名太可惜了。
麦克：跑步我不行，大卫跑得比我快多了。游泳我拿手，可惜没有游泳比赛。
山本：我也是。我网球打得还可以，要是有网球比赛就好了。
麦克：是吗？我也喜欢打网球，下午咱们俩打一场，怎么样？
山本：行。`,

  vocab: [
    { word:'以为',pinyin:'yǐwéi'},{word:'医生',pinyin:'yīshēng'},{word:'抽烟',pinyin:'chōu yān'},
    { word:'好处',pinyin:'hǎochù'},{word:'运动会',pinyin:'yùndònghuì'},{word:'报名',pinyin:'bào míng'},
    { word:'当',pinyin:'dāng'},{word:'拉拉队',pinyin:'lālāduì'},{word:'队员',pinyin:'duìyuán'},
    { word:'可惜',pinyin:'kěxī'},{word:'网球',pinyin:'wǎngqiú'},{word:'还可以',pinyin:'hái kěyǐ'},
    { word:'场',pinyin:'chǎng'}
  ],

  textQuestions: [
    { id:'tq1', text:'山本今天为什么来晚了？', answer:'昨天咳嗽咳得很厉害，晚上没睡好。' },
    { id:'tq2', text:'山本为什么咳嗽？', answer:'医生说他抽烟抽得太多了。' },
    { id:'tq3', text:'医生劝山本怎么做？', answer:'少抽烟，多锻炼。' },
    { id:'tq4', text:'运动会麦克报名了吗？他做什么？', answer:'没有。他当拉拉队队员。' },
    { id:'tq5', text:'山本觉得麦克应该参加什么比赛？为什么？', answer:'跑步，因为山本觉得麦克跑得比他们都快。' }
  ],

  // ✅ 语法练习
  // 填空题结构：A + V + [空1=得] + [空2=比] + B + [空3=形容词]
  grammarItems: [
    // ---- 填空题（3道） ----
    { type:'fill', id:'f1',
      // 句子用 | 作为分隔符，方便拆分：A | V | 得 | 比 | B | Adj
      parts: ['麦克','网球打','得','比','大卫','好'],
      answer: ['得','比','好'],
      hint: '参考：麦克网球打得比大卫好。' },
    { type:'fill', id:'f2',
      parts: ['老师','来','得','比','山本','早'],
      answer: ['得','比','早'],
      hint: '参考：老师来得比山本早。' },
    { type:'fill', id:'f3',
      parts: ['玛丽','起','得','比','麦克','早'],
      answer: ['得','比','早'],
      hint: '参考：玛丽起得比麦克早。' },

    // ---- 选择题（5道） ----
    { type:'choice', id:'c1', question:'谁起得早？', options:['A. 玛丽起得比麦克早。','B. 麦克起得比玛丽早。'], answer:'A' },
    { type:'choice', id:'c2', question:'谁考试考得好？', options:['A. 玛丽考得比麦克好。','B. 麦克考得比玛丽好。'], answer:'A' },
    { type:'choice', id:'c3', question:'谁游泳游得快？', options:['A. 玛丽游得比麦克快。','B. 麦克游得比玛丽快。'], answer:'B' },
    { type:'choice', id:'c4', question:'谁说汉语说得流利？', options:['A. 玛丽说得比麦克流利。','B. 麦克说得比玛丽流利。'], answer:'A' },
    { type:'choice', id:'c5', question:'谁唱歌唱得好听？', options:['A. 玛丽唱得比麦克好听。','B. 麦克唱得比玛丽好听。'], answer:'A' }
  ]
};

// ================================================================
// 🧠 应用状态
// ================================================================
const state = {
  student: { name:'', class:'', date:'' },
  textAnswers: {}, textCorrect: {},
  vocabSelections: {}, vocabCorrect: {},
  grammarAnswers: {}, grammarCorrect: {}, // 填空存['得','比','好']，选择存'A'
  pronErrors: [],
  currentStep: 0,
  submitted: false,
};

// ================================================================
// 🔧 工具函数
// ================================================================
function shuffle(arr) { return [...arr].sort(()=>Math.random()-0.5); }
function saveStudentData() {
  const all = JSON.parse(localStorage.getItem('studentPracticeData')||'[]');
  const idx = all.findIndex(d=>d.name===state.student.name&&d.class===state.student.class);
  const rec = {
    name:state.student.name, class:state.student.class, date:state.student.date,
    scores:{ text:Object.values(state.textCorrect).filter(v=>v).length,
             grammar:Object.values(state.grammarCorrect).filter(v=>v).length,
             vocab:Object.values(state.vocabCorrect).filter(v=>v).length },
    pronCount:state.pronErrors.length, total:0, timestamp:new Date().toISOString()
  };
  rec.total = rec.scores.text+rec.scores.grammar+rec.scores.vocab;
  idx!==-1 ? all[idx]=rec : all.push(rec);
  localStorage.setItem('studentPracticeData',JSON.stringify(all));
}
function loadAllStudents() { return JSON.parse(localStorage.getItem('studentPracticeData')||'[]'); }
function renderTeacherTable() {
  const data = loadAllStudents();
  const wrap = document.getElementById('teacherPanel');
  if(!data.length){wrap.innerHTML='<p class="text-muted">暂无学生数据</p>';return;}
  let html='<table class="pron-table"><thead><tr><th>姓名</th><th>班级</th><th>日期</th><th>课文</th><th>生词</th><th>语法</th><th>纠音数</th><th>总分</th></tr></thead><tbody>';
  data.forEach(d=>{html+=`<tr><td>${d.name}</td><td>${d.class}</td><td>${d.date}</td><td>${d.scores.text}</td><td>${d.scores.vocab}</td><td>${d.scores.grammar}</td><td>${d.pronCount}</td><td>${d.total}</td></tr>`;});
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

// ================================================================
// 🖌 渲染函数
// ================================================================
function renderText() {
  document.getElementById('textContent').innerHTML = DATA.text.replace(/\n/g,'<br>');
  let html='';
  DATA.textQuestions.forEach((q,idx)=>{
    const val=state.textAnswers[q.id]||'';
    html+=`<div class="card" style="margin-bottom:12px;">
      <div style="font-weight:600;margin-bottom:8px;">${idx+1}. ${q.text}</div>
      <textarea data-id="${q.id}" oninput="state.textAnswers[q.id]=this.value" ${state.submitted?'disabled':''}
        style="width:100%;padding:10px;border:1.5px solid #dce4ed;border-radius:10px;font-size:14px;resize:vertical;" rows="2" placeholder="写下你的答案...">${val}</textarea>
      ${state.submitted&&state.textCorrect[q.id]===false?`<div style="color:#e74c3c;font-size:14px;margin-top:6px;">👉 ${q.answer}</div>`:''}
      ${state.submitted&&state.textCorrect[q.id]?'<div style="color:#27ae60;font-size:14px;margin-top:6px;">✅ 正确</div>':''}
    </div>`;
  });
  document.getElementById('textQuestions').innerHTML=html;
}

function renderVocab() {
  const c=document.getElementById('vocabMatch');
  const pinyins=shuffle(DATA.vocab.map(v=>v.pinyin));
  let html='';
  DATA.vocab.forEach((item,index)=>{
    const sel=state.vocabSelections[index]||'';
    const ok=state.vocabCorrect[index];
    let cls='vocab-select',fb='';
    if(state.submitted){ if(ok){cls+=' correct';fb=' ✅';}else{cls+=' wrong';fb=` ❌ 正确：${item.pinyin}`;} }
    html+=`<div class="vocab-row"><span class="vocab-word">${item.word}</span>
      <select class="${cls}" data-index="${index}" onchange="state.vocabSelections[index]=this.value" ${state.submitted?'disabled':''}>
        <option value="">-- 请选择 --</option>
        ${pinyins.map(p=>`<option value="${p}" ${sel===p?'selected':''}>${p}</option>`).join('')}
      </select><span class="vocab-feedback">${fb}</span></div>`;
  });
  c.innerHTML=html;
}

// ✅ 语法渲染（按 parts 数组精确拆分：A | V | [空=得] | [空=比] | B | [空=形容词]）
function renderGrammar() {
  const container = document.getElementById('grammarPractice');

  // ---- 导语 + 参考词卡 + 红色例句 ----
  let html = `
    <div style="margin-bottom:16px;padding:12px 16px;background:#f7faff;border-radius:12px;">
      <strong>一、填空题</strong><br>
      <span style="color:#6a7b8c;font-size:14px;">
        请用正确的词语填空，完成"<span style="color:#c62828;font-weight:700;">A + V + 得 + 比 + B + Adj</span>"的句型。<br>
        提示：从上方参考词汇中选择"得""比"和形容词填入横线。
      </span>
    </div>
    <div class="ref-words">
      <span class="ref-word-chip">得</span>
      <span class="ref-word-chip">比</span>
      <span class="ref-word-chip">好</span>
      <span class="ref-word-chip">早</span>
    </div>
    <div class="example-sentence">
      📌 例句：大卫<span class="em-orange">跑</span>得比麦克<span class="em-orange">快</span>多了。
    </div>`;

  // ---- 填空题（按 parts 精确渲染） ----
  // parts 结构: [A, V, 空1=得, 空2=比, B, 空3=形容词]
  // 渲染顺序: A + V + [input] + [input] + B + [input]
  DATA.grammarItems.filter(q=>q.type==='fill').forEach((q,idx)=>{
    const vals = state.grammarAnswers[q.id] || ['','',''];
    const isCorrect = state.grammarCorrect[q.id];
    const p = q.parts; // [A, V, '得', '比', B, '好']

    // A + V + 空(得) + 空(比) + B + 空(形容词)
    const sentenceHtml = `
      ${p[0]}　${p[1]}
      <input class="blank-input small" data-id="${q.id}" data-idx="0" value="${vals[0]}" oninput="updateGrammarInput(this)" ${state.submitted?'disabled':''} placeholder="?">
      <input class="blank-input small" data-id="${q.id}" data-idx="1" value="${vals[1]}" oninput="updateGrammarInput(this)" ${state.submitted?'disabled':''} placeholder="?">
      ${p[4]}
      <input class="blank-input" data-id="${q.id}" data-idx="2" value="${vals[2]}" oninput="updateGrammarInput(this)" ${state.submitted?'disabled':''} placeholder="?">
    `;

    html += `
      <div class="card" style="margin-bottom:12px;">
        <div style="margin-bottom:8px;font-weight:600;font-size:16px;line-height:2.4;display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
          <span style="margin-right:8px;">${idx+1}.</span> ${sentenceHtml}
        </div>
        ${state.submitted&&!isCorrect?`<div style="color:#e74c3c;font-size:14px;">👉 ${q.hint}</div>`:''}
        ${state.submitted&&isCorrect?'<div style="color:#27ae60;font-size:14px;">✅ 正确</div>':''}
      </div>`;
  });

  // ---- 选择题导语 ----
  html += `<div style="margin:28px 0 12px;padding:12px 16px;background:#f7faff;border-radius:12px;">
    <strong>二、选择题</strong><br>
    <span style="color:#6a7b8c;font-size:14px;">请根据问题，选择正确的答句序号填入括号内。</span>
  </div>`;

  // ---- 选择题 ----
  DATA.grammarItems.filter(q=>q.type==='choice').forEach((q,idx)=>{
    const ua = state.grammarAnswers[q.id]||'';
    const ok = state.grammarCorrect[q.id];
    html+=`<div class="card" style="margin-bottom:12px;">
      <div style="font-weight:600;margin-bottom:10px;line-height:1.8;">
        ${idx+1}. ${q.question}
        ${!state.submitted?`<input class="blank-input small" data-id="${q.id}" value="${ua}" oninput="state.grammarAnswers[q.id]=this.value.trim()" style="width:40px;text-align:center;" placeholder="?">`:`(${ua||'未答'})`}
      </div>`;
    q.options.forEach(opt=>{
      const L=opt.charAt(0);let s='';
      if(state.submitted){if(L===q.answer)s='color:#27ae60;font-weight:600;';else if(L===ua&&ua!==q.answer)s='color:#e74c3c;';}
      html+=`<div style="padding:6px 0;${s}">${opt}</div>`;
    });
    if(state.submitted&&!ok) html+=`<div style="color:#e74c3c;font-size:14px;margin-top:6px;">👉 正确答案：${q.answer}</div>`;
    else if(state.submitted&&ok) html+=`<div style="color:#27ae60;font-size:14px;margin-top:6px;">✅ 正确</div>`;
    html+=`</div>`;
  });

  container.innerHTML = html;
}

function updateGrammarInput(el) {
  const id=el.dataset.id, idx=parseInt(el.dataset.idx);
  if(!state.grammarAnswers[id]) state.grammarAnswers[id]=['','',''];
  state.grammarAnswers[id][idx]=el.value.trim();
}

// ----- 智言纠音 -----
function renderPron() {
  const tb=document.getElementById('pronTbody');
  if(!state.pronErrors.length) state.pronErrors.push({wrongChar:'',correctPinyin:'',redCount:1,corrected:false});
  tb.innerHTML=state.pronErrors.map((p,i)=>`<tr>
    <td><input type="text" value="${p.wrongChar}" oninput="p.wrongChar=this.value" placeholder="如：得"></td>
    <td><input type="text" value="${p.correctPinyin}" oninput="p.correctPinyin=this.value" placeholder="如：de"></td>
    <td><input type="number" value="${p.redCount}" min="1" oninput="p.redCount=+this.value||1" style="width:80px;"></td>
    <td style="text-align:center;"><input type="checkbox" ${p.corrected?'checked':''} onchange="p.corrected=this.checked"></td>
    <td><button class="del-btn" onclick="if(state.pronErrors.length>1){state.pronErrors.splice(${i},1);renderPron();}else alert('至少保留一行')">删除</button></td>
  </tr>`).join('');
}

function addPronRow(){ state.pronErrors.push({wrongChar:'',correctPinyin:'',redCount:1,corrected:false}); renderPron(); }

// ================================================================
// 📊 生成报告
// ================================================================
function generateReport() {
  const c=document.getElementById('finalReport');
  const name=state.student.name||'同学', cls=state.student.class||'CLT004', date=state.student.date;
  const ts=Object.values(state.textCorrect).filter(v=>v).length;
  const gs=Object.values(state.grammarCorrect).filter(v=>v).length;
  const vs=Object.values(state.vocabCorrect).filter(v=>v).length;
  const total=ts+gs+vs, max=DATA.textQuestions.length+DATA.grammarItems.length+DATA.vocab.length;
  const mistakes=[];
  DATA.textQuestions.forEach(q=>{if(!state.textCorrect[q.id])mistakes.push(`📖 ${q.text} —— ${q.answer}`);});
  DATA.grammarItems.forEach(q=>{
    if(!state.grammarCorrect[q.id]){
      if(q.type==='fill'){const u=state.grammarAnswers[q.id]||['','',''];mistakes.push(`📐 ${q.parts.join('')} —— 正确：${q.answer.join('、')}`);}
      else{mistakes.push(`📐 ${q.question} —— 正确：${q.answer}`);}
    }
  });
  DATA.vocab.forEach((item,idx)=>{if(!state.vocabCorrect[idx])mistakes.push(`📚 ${item.word} —— ${item.pinyin}`);});
  let adv='';const r=total/max;
  if(r>=0.9)adv='🌟 非常优秀！';else if(r>=0.7)adv='👍 不错，复习错题！';else if(r>=0.5)adv='📖 需要加强！';else adv='💪 别灰心！';

  c.innerHTML=`
    <h2>📝 我的专属学习笔记</h2>
    <p><strong>姓名：</strong>${name}　<strong>班级：</strong>${cls}　<strong>日期：</strong>${date}</p>
    <div class="stat-grid">
      <div class="stat-item"><div class="num">${total}</div><div class="label">总分/${max}</div></div>
      <div class="stat-item"><div class="num">${ts}/${DATA.textQuestions.length}</div><div class="label">课文</div></div>
      <div class="stat-item"><div class="num">${vs}/${DATA.vocab.length}</div><div class="label">生词</div></div>
      <div class="stat-item"><div class="num">${gs}/${DATA.grammarItems.length}</div><div class="label">语法</div></div>
    </div>
    <h3>📋 错题与建议</h3>
    ${mistakes.length?mistakes.map(m=>`<p style="padding:8px 12px;background:#fdf5f4;border-left:4px solid #e74c3c;border-radius:6px;margin-bottom:6px;">${m}</p>`).join(''):'<p style="padding:8px 12px;background:#f0faf4;border-left:4px solid #27ae60;border-radius:6px;">✅ 全部正确！</p>'}
    <p><strong>💡 ${adv}</strong></p>
  `;
}

// ================================================================
// 🚀 流程控制
// ================================================================
function submitAll() {
  if(state.submitted)return;
  DATA.textQuestions.forEach(q=>{state.textCorrect[q.id]=(state.textAnswers[q.id]||'').trim()===q.answer;});
  DATA.vocab.forEach((item,idx)=>{state.vocabCorrect[idx]=(state.vocabSelections[idx]||'')===item.pinyin;});
  DATA.grammarItems.forEach(q=>{
    if(q.type==='fill'){
      const u=state.grammarAnswers[q.id]||['','',''];
      state.grammarCorrect[q.id]=u[0]===q.answer[0]&&u[1]===q.answer[1]&&u[2]===q.answer[2];
    }else{
      state.grammarCorrect[q.id]=(state.grammarAnswers[q.id]||'').trim()===q.answer;
    }
  });
  state.submitted=true;
  saveStudentData();
  renderAll();generateReport();renderTeacherTable();
}

function goToStep(step) {
  if(step<0||step>5)return;
  if(step===5){if(!state.submitted)submitAll();}
  state.currentStep=step;
  document.querySelectorAll('.step-btn').forEach((b,i)=>{
    b.classList.toggle('active',i===step);
    b.disabled=i>step;
    b.classList.toggle('done',i<step);
  });
  document.querySelectorAll('.panel').forEach(p=>{p.classList.toggle('active',+p.dataset.step===step);});
  window.scrollTo({top:0,behavior:'smooth'});
  renderAll();
  if(step===5)generateReport();
  if(step===0)renderTeacherTable();
}

function renderAll(){
  renderText();renderVocab();renderGrammar();renderPron();
  document.getElementById('studentBadge').textContent=state.student.name?`👤 ${state.student.name} (${state.student.class})`:'👤 未登录';
}

function startPractice(){
  const n=document.getElementById('studentName').value.trim();
  if(!n){alert('请输入姓名');return;}
  state.student.name=n;
  state.student.class=document.getElementById('studentClass').value.trim()||'CLT004';
  state.student.date=document.getElementById('studentDate').value||new Date().toISOString().slice(0,10);
  goToStep(1);
}

function toggleTeacher(){
  const p=document.getElementById('teacherPanel');
  p.classList.toggle('hidden');
  if(!p.classList.contains('hidden'))renderTeacherTable();
}

function resetAll(){
  if(!confirm('确定重置所有进度？'))return;
  state.textAnswers={};state.textCorrect={};state.vocabSelections={};state.vocabCorrect={};
  state.grammarAnswers={};state.grammarCorrect={};state.pronErrors=[];state.submitted=false;state.currentStep=0;
  goToStep(0);
}

// ================================================================
// 🚀 初始化
// ================================================================
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('studentDate').value=new Date().toISOString().slice(0,10);
  renderAll();goToStep(0);
});
</script>
</body>
</html>
